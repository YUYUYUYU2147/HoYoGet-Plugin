<!doctype html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html;charset=utf-8" />
    <link rel="stylesheet" type="text/css" href="{{ppath}}sign/group_sign.css" />
  </head>

  <body {{sys.scale}}>
    <div class="container" id="container">
      <div class="gs-card">
        <div class="gs-head">
          <img class="avatar" src="{{ppath}}sign/xhh_avatar.png" />
          <div class="gs-head-text">
            <div class="brand">米哈游</div>
            <div class="sub">本群签到完成</div>
          </div>
          <div class="gs-badge done">已完成</div>
        </div>

        <div class="gs-stats">
          <div class="gs-stat total">
            <div class="k">参与账号</div>
            <div class="v">{{z_num}}</div>
          </div>
          <div class="gs-stat ok">
            <div class="k">签到成功</div>
            <div class="v">{{num}}</div>
          </div>
          <div class="gs-stat fail">
            <div class="k">签到失败</div>
            <div class="v">{{sbai_qqs.length}}</div>
          </div>
        </div>

        <div class="gs-group">
          <div class="gs-group-title">
            <span class="dot"></span>
            <span>签到成功的用户</span>
            <span class="count">共 {{cg_qqs.length}} 人</span>
          </div>
          {{if cg_qqs.length}}
          <div class="gs-users">
            {{each cg_qqs qq}}
            <div class="gs-user">
              <img src="https://q1.qlogo.cn/g?b=qq&s=140&nk={{qq}}.jpg" />
              <div class="qq">{{qq}}</div>
            </div>
            {{/each}}
          </div>
          {{else}}
          <div class="gs-empty">没有成功记录</div>
          {{/if}}
        </div>

        {{if sbai_qqs.length}}
        <div class="gs-group fail">
          <div class="gs-group-title">
            <span class="dot"></span>
            <span>签到失败的用户</span>
            <span class="count">共 {{sbai_qqs.length}} 人</span>
          </div>
          <div class="gs-users">
            {{each sbai_qqs qq}}
            <div class="gs-user">
              <img src="https://q1.qlogo.cn/g?b=qq&s=140&nk={{qq}}.jpg" />
              <div class="qq">{{qq}}</div>
            </div>
            {{/each}}
          </div>
        </div>
        {{/if}}

        <div class="gs-foot">
          <span class="src"><span style="color:#ff4d4f;font-weight:600">from 米哈游</span></span>
        </div>
      </div>
    </div>
  </body>
</html>
