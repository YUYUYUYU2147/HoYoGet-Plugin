<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HoYoGet 数据</title>
  <link rel="stylesheet" href="data-management.css">
  <script type="module" src="data-management.js"></script>
</head>
<body>
  <main aria-busy="false">
    <header class="topbar">
      <span>数据管理 <b>/</b> HoYoGet 数据</span>
      <button id="refresh" type="button" title="刷新数据">刷新</button>
    </header>
    <section class="heading">
      <div>
        <p class="eyebrow">HOYOGET DATA</p>
        <h1>HoYoGet 数据</h1>
        <p>按用途和游戏查看插件保存的文件</p>
        <code>保存位置：云崽根目录 / data/HoYoGet-Plugin/</code>
      </div>
      <span class="readonly">只读浏览</span>
    </section>
    <nav id="categories" class="category-tabs" role="tablist" aria-label="数据用途"></nav>
    <section class="workspace">
      <section class="file-panel" aria-label="数据文件">
        <div class="filters">
          <label class="search"><span>筛选</span><input id="search" type="search" maxlength="200" placeholder="用途或文件名"></label>
          <label class="game-filter"><span>游戏</span><select id="game"></select></label>
        </div>
        <p id="status" role="status" aria-live="polite">正在读取 HoYoGet 数据…</p>
        <div class="list-heading"><span>数据用途 / 文件路径</span><span>大小</span></div>
        <div id="files" class="files"></div>
        <footer class="pager">
          <span id="count">0 项</span>
          <div><button id="previous" type="button" aria-label="上一页">上一页</button><span id="page">1 / 1</span><button id="next" type="button" aria-label="下一页">下一页</button></div>
        </footer>
      </section>
      <section class="preview-panel" aria-labelledby="preview-title">
        <header class="preview-heading">
          <div><h2 id="preview-title">数据内容</h2><p id="file-meta"></p></div>
          <button id="download" type="button" hidden>下载原文件</button>
        </header>
        <div id="empty" class="empty"><h3>选择一条数据</h3><p>文件内容将在此处预览</p></div>
        <div id="preview" hidden>
          <p id="notice" class="notice" hidden></p>
          <div id="content-type" class="content-type"></div>
          <pre id="content"></pre>
          <img id="image" alt="HoYoGet 数据图片预览" hidden>
        </div>
      </section>
    </section>
    <p class="footnote">数据页面不提供删除或在线修改。账号凭据预览会脱敏；下载原文件可能包含敏感信息，请妥善保管。</p>
  </main>
</body>
</html>
