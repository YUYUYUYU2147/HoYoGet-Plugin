<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
@font-face {
  font-family: 'CuteFont';
  src: url('file://{{fontDir}}/可爱字体.ttf') format('truetype');
}
@font-face {
  font-family: 'EmojiFont';
  src: url('file://{{fontDir}}/NotoColorEmoji.ttf') format('truetype');
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: max-content; height: max-content; }
body { font-family: 'CuteFont', sans-serif; background: transparent; display: block; padding: 18px; }
.card {
  background: #fff;
  border-radius: 20px;
  padding: 20px 24px;
  border: 5px solid {{borderColor}};
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 18px;
  width: 540px;
  box-shadow: 0 5px 22px rgba(0,0,0,0.14);
}
.avatar { width: 112px; height: 112px; border-radius: 14px; flex-shrink: 0; overflow: hidden; border: 3px solid {{borderColor}}; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.info { flex: 1; min-width: 0; }
.info-line { font-size: 16px; color: {{textColor}}; line-height: 1.75; word-break: break-all; }
.info-line .label { color: {{labelColor}}; }
</style>
</head>
<body>
<div class="card">
  <div class="avatar"><img src="{{avatarUrl}}" alt="avatar" onerror="this.style.display='none'"></div>
  <div class="info">
    {{each display}}
    <div class="info-line">{{$value}}</div>
    {{/each}}
  </div>
</div>
</body>
</html>
