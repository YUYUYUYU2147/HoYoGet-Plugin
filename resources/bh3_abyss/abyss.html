<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css" href="{{ppath}}bh3_abyss/abyss.css" />
</head>
<body {{sys.scale}}>
  <div class="container {{hideFooter}}" style="background-image: url({{ppath}}Tl/imgs/{{bg}}.jpg)">
    <div class="xhh_box">
      <div class="header">
        <div class="player">
          <div class="avatar">
            {{if avatarUrl}}
            <img src="{{avatarUrl}}" alt="">
            {{else}}
            <span>舰</span>
            {{/if}}
          </div>
          <div class="player-info">
            <div class="nickname">{{nickname}}</div>
            <div class="meta">UID {{uid}} · {{region}} · Lv.{{level}}</div>
            <div class="stats">
              <span class="stat">舰龄 {{activeDays}} 天</span>
              <span class="stat">舰长评级 <b>{{rating}}</b></span>
            </div>
          </div>
        </div>
        <div class="brand">
          <div class="brand-lockup">
            <img class="brand-game-icon" src="{{gameIcon}}" alt="崩坏3">
            <img class="brand-logo" src="{{gameLogo}}" alt="HONKAI IMPACT 3RD">
          </div>
          <div class="brand-kicker">HONKAI IMPACT 3RD</div>
          <div class="title"><span class="label-icon label-{{label}}"></span>{{label}}<b>战报</b></div>
        </div>
      </div>

      {{# reportHtml}}

      <div class="footer">{{@copy()}} · {{dataTime}}</div>
    </div>
  </div>
</body>
</html>
