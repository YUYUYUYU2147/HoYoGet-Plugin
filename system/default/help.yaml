- group: 常用功能
  list:
    - title: '#帮助 / #全局帮助'
      desc: '查看全部指令（也可在锅巴「全局帮助」里搜索、按游戏筛选）'
    - title: '#日历 / *日历 / %日历'
      desc: '查看原神/星铁/绝区零活动日历，可带游戏名，如 #星铁日历'
    - title: '#米哈游原神帮助 / #米哈游星铁帮助'
      desc: '查看对应游戏的详细指令'
    - title: '#米哈游绝区零帮助 / #米哈游崩三帮助'
      desc: '查看对应游戏的详细指令'
    - title: '#米哈游签到 / #米哈游全部游戏签到'
      desc: '签到当前账号；全部游戏签到所有已绑定账号'
    - title: '#米哈游社区签到 / #米哈游社区全部签到'
      desc: '米游社社区签到；全部签到包含米游币任务'
    - title: '#米哈游体力 / #米哈游全体力'
      desc: '查看原神、星铁、绝区零、崩三体力'
    - title: '#米哈游开启体力推送 / #米哈游关闭体力推送'
      desc: '在当前群开启/关闭四游戏体力推送；只有主动开启的用户才会收到推送'
    - title: '#米哈游开启原神体力推送 / #米哈游关闭原神体力推送'
      desc: '单独开启/关闭原神体力推送；支持星铁、绝区零、崩三'
    - title: '#米哈游官方当前卡池'
      desc: '查看四游戏官方卡池'
    - title: '#米哈游刷新卡池数据'
      desc: '手动刷新官方卡池缓存；同时刷新崩三抽卡记录（需stoken）与崩三卡池观测快照'
    - title: '#米哈游角色图鉴 / #米哈游武器图鉴'
      desc: '查询角色、武器及装备图鉴；只写类别则返回该类全部列表'
    - title: '米游社更新面板 / 米游社<角色>面板'
      desc: '绝区零面板：查看自己全部代理人面板列表，或单个角色的技能、音擎、驱动盘评分与伤害计算'
    - title: '%<角色>面板排名 / %面板排名范围'
      desc: '绝区零跨用户面板排名（期望伤害 + 驱动盘评分），可切换本群 / 全部范围'
    - title: '#米哈游怪物图鉴'
      desc: '查询四游戏怪物与首领信息'
    - title: '#米哈游深渊速报 / #米哈游深渊速览'
      desc: '查看原神、星铁、崩三深渊相关信息'
    - title: '#星铁全球排名 <角色> / *深渊 / *深渊使用率'
      desc: '星铁全球练度榜、星铁深渊总览、原神深渊使用率，三大榜单数据一键出图'
    - title: '#原石 / #星琼 / #绝区零菲林'
      desc: '查询本月原石、星琼、菲林等账本收入，可带月份，如「#原石8月」「#星琼202608」'
    - title: '#原石统计 / #星琼统计 / #绝区零菲林统计'
      desc: '按月统计累计收入（柱状图 + 来源占比环形图）'
    - title: '#米哈游原石 / #米哈游星琼统计'
      desc: '上面这些账本指令都能加「米哈游」前缀，也可以不加'
    - title: '#米哈游攻略 / #米哈游配队'
      desc: '查询角色攻略、深渊和活动配队'
    - title: '#米哈游抽卡记录'
      desc: '查看本地抽卡统计'
    - title: '#米哈游更新抽卡记录'
      desc: '更新官方抽卡记录'
    - title: '#米哈游崩三卡池核对'
      desc: '用抽卡记录核对崩三历史卡池；只读本地数据，不请求米游社接口，可随时执行'
    - title: '#米哈游扫码绑定 / #扫码绑定 / #扫码登录'
      desc: '扫码绑定米游社账号'
    - title: '#数据模式 / #切换正式服模式 / #切换测试服模式'
      desc: '查看或切换图鉴数据源：正式服（默认）出已上线内容，测试服只出未上线内容（卡面带 TEST 角标）'

- group: 游戏快捷入口
  list:
    - title: '#原神帮助'
      desc: '原神体力、卡池、深渊、图鉴、抽卡和攻略'
    - title: '#星铁帮助'
      desc: '星铁体力、卡池、深渊、图鉴、抽卡和攻略'
    - title: '#绝区零帮助'
      desc: '绝区零体力、防卫战、危局、图鉴、卡池和攻略'
    - title: '#崩三帮助'
      desc: '崩三深渊、战场、乐土、图鉴、卡池和抽卡'
    - title: '#卡池帮助'
      desc: '查看卡池查询、历史卡池和卡池计时指令'
    - title: '#图鉴帮助'
      desc: '查看角色、武器、装备和怪物图鉴指令'
    - title: '#攻略帮助'
      desc: '查看角色攻略、深渊攻略和配队指令'

- group: 账号与设置
  list:
    - title: '#米哈游扫码绑定 / #扫码绑定 / #扫码登录 / #删除stoken'
      desc: '绑定或删除米游社账号'
    - title: '#米哈游设备帮助'
      desc: '查看设备绑定和验证相关指令'
    - title: '#米哈游手动验证码服务自测'
      desc: '检查本地验证码服务与公网隧道是否可用，链接形如 <域名>/HoYoGet-gt/<8位随机码>'
    - title: '#米哈游过码服务状态 / #米哈游过码服务部署'
      desc: '查看或部署滑块解码器（pm2 进程 xhh-geetest-solver）'
    - title: '#米哈游B站帮助'
      desc: '查看B站登录、解析、推送和直播功能'
    - title: '#米哈游完整帮助'
      desc: '查看全部详细命令，内容较长'
