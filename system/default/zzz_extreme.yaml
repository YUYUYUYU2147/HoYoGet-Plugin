# 绝区零极限面板预设（**逐角色人工策展**，不再是自动生成）
#
# 本文件是极限面板的「最优配装知识」载体，每个角色一条，运行时**逐字照用**。
# 自动推导（按职业猜主词条、按评分权重分配副词条）已废弃：同一个职业内不同角色
# 的最优解差异很大，职业级规则只能给出「大致合理」，而极限面板的定义就是理论最优。
#
# ── 字段说明 ────────────────────────────────────────────────────────────
# char_id   角色 ID（接口 avatar/info 的 id）
# weapon_id 音擎 ID。S 级一律用专武；专武 CodeName 形如 Weapon_S_<char_id>，
#           属精确映射，不是猜的。佩洛伊斯例外（CodeName 是 Weapon_S_Common_04，
#           但被动写明「装备者为佩洛伊斯时」→ 14155 日冕遗蜕）。
#           A 级角色无专武，从 A 级音擎里按机制挑，各条都在下面注明理由。
# drive_main 4/5/6 号位主词条 property_id
# crit_sub  该角色**盘内**暴击副词条上限（%）。留空 = 走通用规则
#           （补到面板暴击 100%，上限 48%）。低暴击需求的角色显式压到 4.8%
#           （= 2 档，只落在 4 号暴伤主盘），其余副词条全中暴伤。
# sub_layout 副词条布局 [属性id, 档数]，**每盘合计 9 档**
#           （4 条初始 + 5 条强化，单条至多 6 档；副词条不与主词条重复）。
#           other = 1/2/3/5/6 号盘；main4 = 4 号（暴伤主）盘，未单列时回落 other。
#
# ── 属性 id 速查 ────────────────────────────────────────────────────────
# 主词条：11102 生命% / 12102 攻击% / 13102 防御% / 12202 冲击力 / 20103 暴击率 /
#         21103 暴击伤害 / 23103 穿透率 / 30502 能量回复 / 31203 异常精通 /
#         31402 异常掌控 / 31503 物理伤 / 31603 火伤 / 31703 冰伤 / 31803 电伤 /
#         31903 以太伤 / 32303 风伤
# 副词条：11102/11103 生命 / 12102/12103 攻击 / 13102/13103 防御 / 20103 暴击率 /
#         21103 暴伤 / 23203 穿透值 / 31203 异常精通 / 31402 异常掌控
# ⚠ 驱动盘副词条只有「穿透值 23203」，**没有穿透率**；穿透率(23103) 只作 5 号位主词条。
#
# ── 本轮策展依据（角色级微调的理由都写在各条注释里）────────────────────
# 强攻 / 支援：4 暴伤 + 5 属性伤害 + 6 攻击%，副词条双爆堆满暴伤
# 异常：4 暴伤 + 5 属性伤害 + 6 异常掌控，副词条 other 堆异常精通
# 击破：A 级（安比/波可娜）走冲击力；S 级走双爆，失衡增益由音擎/套装给
# 命破：堆生命值，贯穿伤害不吃暴击 → crit_sub 压到 4.8
# 防护 / 锋御：堆防御力，同样不吃暴击 → crit_sub 压到 4.8
#
# 未收录：哲(2011)、铃(2021) —— 本地角色表里没有稀有度与职业，不是可用代理人。

